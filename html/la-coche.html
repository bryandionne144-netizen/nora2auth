  <style>
:root {
  --ink: #05070c;
  --ink-2: #0b1220;
  --ice: #f4f8ff;
  --muted: #9aadc4;
  --line: rgba(186, 220, 255, 0.14);
  --blue: #49c8ff;
  --blue-2: #1c7dff;
  --good: #3ee0a2;
  --bad: #ff6b86;
  --warn: #ffc14d;
  --radius: 28px;
  --shadow: 0 30px 80px rgba(0, 0, 0, 0.35);
  --font: "Instrument Sans", "Avenir Next", "Segoe UI", sans-serif;
  --display: "Instrument Sans", "Avenir Next", sans-serif;
  --serif: "Instrument Serif", Georgia, serif;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  min-height: 100vh;
  background: var(--ink);
  color: var(--ice);
  font-family: var(--font);
  font-size: 17px;
  line-height: 1.6;
  font-weight: 430;
  letter-spacing: -0.011em;
  overflow-x: clip;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
img { max-width: 100%; display: block; }
a { color: inherit; text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
::selection { background: #1c7dff; color: white; }
:focus-visible { outline: 2px solid #8ad8ff; outline-offset: 3px; }

.progress {
  position: fixed;
  inset: 0 0 auto 0;
  height: 2px;
  z-index: 80;
  background: linear-gradient(90deg, #1c7dff, #9aefff);
  transform: scaleX(0);
  transform-origin: 0 50%;
}
.aurora, .grid-bg { position: fixed; inset: 0; pointer-events: none; }
.aurora { z-index: -2; overflow: hidden; }
.aurora span {
  position: absolute;
  width: 46vw;
  height: 46vw;
  border-radius: 50%;
  filter: blur(70px);
  opacity: 0.55;
  animation: drift 22s ease-in-out infinite;
}
.aurora span:nth-child(1) { background: #145dff; top: -12vw; right: -6vw; }
.aurora span:nth-child(2) { background: #0a3148; width: 38vw; height: 38vw; bottom: 8vh; left: -10vw; animation-delay: -8s; }
.aurora span:nth-child(3) { background: #1a8cff; width: 24vw; height: 24vw; top: 38vh; left: 42vw; opacity: 0.22; animation-delay: -14s; }
.grid-bg {
  z-index: -1;
  background-image:
    linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
  background-size: 84px 84px;
  mask-image: radial-gradient(circle at 50% 20%, #000 20%, transparent 75%);
  opacity: 0.45;
}

.container { width: min(1160px, calc(100% - 40px)); margin-inline: auto; }
.section { padding: clamp(72px, 10vw, 128px) 0; }
section[id], main[id] { scroll-margin-top: 96px; }
.section-head { max-width: 680px; margin-bottom: 36px; }
.section-head h2, .hero h1, .quote-band blockquote {
  font-family: var(--display);
  letter-spacing: -0.028em;
  line-height: 1.02;
  margin: 0;
}
.section-head h2 { font-size: clamp(2.2rem, 4.6vw, 4.15rem); font-weight: 600; }

.hero {

.ring {

.ring::before {

.r2 { inset: 8%; animation-duration: 16s; animation-direction: reverse; opacity: 0.7; }

.drop {

.d2 { right: 16%; top: 22%; animation-delay: 1.2s; }
.d3 { left: 10%; bottom: 28%; animation-delay: 2s; }
.d4 { right: 12%; bottom: 18%; animation-delay: 0.6s; }
.float-card {

.marquee {

}
.marquee-track { display: flex; width: max-content; animation: marquee 32s linear infinite; }

.marquee-group { display: flex; align-items: center; gap: 22px; padding-right: 22px; }

.about-grid, .hours-layout, .faq-layout, .booking-grid {

}

}

}
.points p, .service p, .zone p, .step p { margin: 0; color: #b7c6d8; line-height: 1.55; }

.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
.chip {

}
.chip.on { background: white; color: #071018; border-color: white; }
.service-grid, .zone-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.service, .zone, .step { padding: 22px; min-height: 220px; display: flex; flex-direction: column; position: relative; overflow: hidden; }
.service::after, .zone::after {
  content: "";
  position: absolute;
  inset: 0 auto 0 -40%;
  width: 40%;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.16), transparent);
  transform: skewX(-18deg) translateX(-120%);

  pointer-events: none;
}
.service:hover::after, .zone:hover::after { transform: skewX(-18deg) translateX(380%); }
.service:hover, .zone:hover, .review:hover { transform: translateY(-4px); transition: transform 0.3s ease, border-color 0.3s ease; }
.service, .zone, .review { transition: transform 0.3s ease, border-color 0.3s ease; }
.service:hover, .zone:hover { border-color: rgba(73, 200, 255, 0.45); }
.service-top, .service-foot { display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.service p { flex: 1; margin: 12px 0 18px; }
.service-foot strong { font-family: var(--display); font-size: 1.35rem; letter-spacing: -0.04em; }
.service-foot span, .cat { color: var(--muted); font-size: 0.92rem; }
.pill {
  border-radius: 999px;
  padding: 4px 10px;

  letter-spacing: 0.04em;

}
.pill.ok { color: #083222; background: var(--good); }
.pill.bad { color: #3a1020; background: #ffb3c0; }
.signature {

}
.service.featured { background: linear-gradient(180deg, #142743, #0d1524); }
.service.off, .zone.off { opacity: 0.72; }
.zone-area { color: var(--blue) !important; margin: 0 0 8px !important; }
.zone .pill { margin-top: auto; align-self: flex-start; }

.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
.step span { font-size: 1.8rem; }

.gallery {
  display: grid;
  grid-template-columns: 1.35fr 1fr 1fr;
  grid-auto-rows: 250px;
  gap: 14px;
}
.tile {
  position: relative;
  border-radius: 28px;
  overflow: hidden;
  border: 1px solid var(--line);
  min-height: 250px;
}
.tile:first-child { grid-row: span 2; min-height: 100%; }
.tile-visual, .tile-visual img, .motif { position: absolute; inset: 0; }
.tile-visual img { width: 100%; height: 100%; object-fit: cover; }
.tile-index {
  position: absolute;
  top: 16px;
  left: 16px;
  z-index: 2;
  background: rgba(5, 7, 12, 0.45);
  border: 1px solid var(--line);

  padding: 4px 10px;
}
.tile-copy {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  z-index: 2;
  padding: 48px 20px 18px;

}
.tile-copy h3 { margin: 0 0 4px; }
.tile-copy p { margin: 0; color: #d5e2f0; }
.motif { overflow: hidden; }
.motif::before, .motif::after { content: ""; position: absolute; border-radius: 50%; }
.motif-eau { background: linear-gradient(160deg, #041824, #0a4f86 55%, #062033); }
.motif-eau::before {
  width: 80%; height: 80%; left: 10%; top: 20%;
  border: 1px solid rgba(210, 245, 255, 0.35);
  animation: spin 18s linear infinite;
}
.motif-eau::after {
  width: 50%; height: 50%; left: 25%; top: 35%;
  border: 1px solid rgba(255, 255, 255, 0.4);
  animation: spin 12s linear infinite reverse;
}
.motif-cuir { background: linear-gradient(160deg, #1a120e, #4a3426 50%, #120d0b); }
.motif-cuir::before {
  inset: 18% 12%;
  border-radius: 40% 60% 50% 50%;
  background: radial-gradient(circle at 30% 30%, rgba(255, 220, 180, 0.35), transparent 55%);
  animation: floaty 8s ease-in-out infinite;
}
.motif-chrome {
  background: linear-gradient(120deg, #10151c, #8ea0b5 35%, #1b2430 50%, #d5dee8 68%, #0e141c);

  animation: shine 7s linear infinite;
}
.motif-bac { background: linear-gradient(180deg, #07241f, #0e6a62 45%, #04110f); }
.motif-bac::before {
  left: -10%; right: -10%; top: 38%; height: 18%;
  border-radius: 0;
  background: rgba(190, 255, 245, 0.25);
  animation: drift 6s ease-in-out infinite;
}
.motif-jantes {
  background: radial-gradient(circle at 50% 50%, #d7e3ee 0 8%, transparent 9%),
    repeating-conic-gradient(from 0deg, #0d1218 0 8deg, #9aabbd 8deg 12deg);
  animation: spin 24s linear infinite;
}
.motif-nuit { background: radial-gradient(circle at 70% 30%, rgba(73, 200, 255, 0.45), transparent 25%), #070b16; }
.motif-nuit::before, .motif-nuit::after {
  width: 4px; height: 4px; background: white; box-shadow: 40px 30px #fff, 80px 90px #9ad, -30px 50px #fff, 120px 20px #fff;
  animation: pulse 2.4s ease-in-out infinite;
}

.quote-band { padding: clamp(64px, 9vw, 110px) 0; }
.quote-band blockquote {

  font-style: italic;

.reviews { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }

.stars { color: #ffd56a; letter-spacing: 0.12em; margin: 0 0 12px; }
.review blockquote { margin: 0 0 18px; font-size: 1.05rem; }
.who { display: flex; justify-content: space-between; gap: 12px; color: var(--muted); margin: 0; }

.hours { display: grid; gap: 8px; }

.hour em {
  display: inline-block;

  color: var(--blue);
  font-size: 0.78rem;

}

.faq { display: grid; gap: 10px; }
.faq-item { border: 1px solid var(--line); border-radius: 18px; background: rgba(255, 255, 255, 0.02); overflow: hidden; }
.faq-item button {
  width: 100%;
  text-align: left;
  background: transparent;

  padding: 18px 18px;

  justify-content: space-between;
  gap: 16px;

}
.faq-item i::before, .faq-item i::after {
  content: "";
  position: absolute;
  background: var(--blue);
  inset: 6px 0 auto 0;
  height: 1.5px;
}
.faq-item i::after { inset: 0 auto 0 6px; width: 1.5px; height: 14px; transition: transform 0.3s ease; }
.faq-item.open i::after { transform: rotate(90deg); }
.faq-a { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.35s ease; }
.faq-item.open .faq-a { grid-template-rows: 1fr; }
.faq-a > div { overflow: hidden; }
.faq-a p { margin: 0; padding: 0 18px 18px; color: var(--muted); }

.booking { position: relative; }
.form-card { padding: 22px; box-shadow: var(--shadow); }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.field { display: grid; gap: 6px; font-size: 0.86rem; color: var(--muted); }
.field.full { grid-column: 1 / -1; }
.field input, .field select, .field textarea, .pause {
  width: 100%;
  border-radius: 14px;
  border: 1px solid var(--line);
  background: rgba(5, 8, 14, 0.55);
  padding: 13px 14px;
  color: var(--ice);
}
.field textarea { resize: vertical; }
.hp { position: absolute; left: -9999px; }
.form-error { color: #ffb3c0; min-height: 0; }
.form-error[hidden], .success[hidden], #app[hidden], .banner[hidden] { display: none; }
.disclaimer { color: var(--muted); font-size: 0.85rem; }
.contact-row { display: flex; gap: 10px; margin-top: 18px; }
.success { text-align: center; padding: 28px 10px; }
.success h3 { font-family: var(--display); font-size: 2rem; letter-spacing: -0.04em; margin-bottom: 8px; }
.check {
  width: 64px; height: 64px; border-radius: 50%; display: inline-grid; place-items: center;
  background: rgba(62, 224, 162, 0.15); border: 1px solid rgba(62, 224, 162, 0.5); margin-bottom: 12px;

.check::after {

.footer { padding: 56px 0 28px; border-top: 1px solid var(--line); }

.footer h2 { font-size: 0.78rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

.footer-bar {
  display: flex;
  justify-content: space-between;
  gap: 12px;

}

.call-fab {
  display: none;
  position: fixed;
  right: 16px;
  bottom: calc(16px + env(safe-area-inset-bottom));
  z-index: 30;
  background: linear-gradient(180deg, #8adfff, #1c7dff);
  color: #041018;
  border-radius: 999px;
  padding: 12px 16px;
  font-weight: 650;
  box-shadow: 0 12px 30px rgba(28, 125, 255, 0.4);
}
.call-fab span { display: none; }

.js .reveal { opacity: 0; transform: translateY(24px); }
.js .reveal.in { opacity: 1; transform: none; transition: opacity 0.7s ease, transform 0.7s ease; transition-delay: var(--d, 0ms); }

@keyframes drift {

}
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes shine {
  0% { background-position: 0% 50%; }
  100% { background-position: 200% 50%; }
}
@keyframes marquee { to { transform: translateX(-50%); } }
@keyframes pulse {

}
@keyframes floaty {

}
@keyframes droplet {
  0% { transform: translateY(-8px); opacity: 0; }
  15% { opacity: 0.9; }
  100% { transform: translateY(70px); opacity: 0; }
}

@media (max-width: 980px) {
  .hero, .about-grid, .hours-layout, .faq-layout, .booking-grid, .footer-grid, .stats, .service-grid, .zone-grid, .reviews {
    grid-template-columns: 1fr 1fr;
  }
  .steps { grid-template-columns: 1fr 1fr; }
  .gallery { grid-template-columns: 1fr 1fr; }
  .tile:first-child { grid-row: auto; }
  .footer-grid { grid-template-columns: 1fr 1fr; }
  .hero { grid-template-columns: 1fr; min-height: 0; }

  <script type="text/plain" id="lc-admin-css">:root {
  --ink: #05070c;
  --panel: rgba(12, 18, 32, 0.78);
  --panel-strong: rgba(10, 16, 28, 0.92);
  --line: rgba(186, 220, 255, 0.14);
  --line-strong: rgba(154, 214, 255, 0.32);
  --ice: #f4f8ff;
  --muted: #93a6bd;
  --blue: #49c8ff;
  --blue-2: #1c7dff;
  --good: #3ee0a2;
  --bad: #ff6b86;
  --warn: #ffc14d;
  --font: "Instrument Sans", "Avenir Next", "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  min-height: 100vh;
  background: var(--ink);
  color: var(--ice);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.5;
  font-weight: 450;
  letter-spacing: -0.011em;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
::selection { background: #1c7dff; color: white; }
:focus-visible { outline: 2px solid #8ad8ff; outline-offset: 3px; }
#login[hidden], #app[hidden], .banner[hidden] { display: none !important; }

.aurora, .grid-bg { position: fixed; inset: 0; pointer-events: none; }
.aurora { z-index: 0; overflow: hidden; }
.aurora span {
  position: absolute;
  width: 46vw;
  height: 46vw;
  border-radius: 50%;
  filter: blur(80px);
  opacity: 0.45;
}
.aurora span:nth-child(1) { background: #145dff; top: -18vw; right: -8vw; }
.aurora span:nth-child(2) { background: #0a3148; width: 36vw; height: 36vw; bottom: -8vh; left: -10vw; }
.aurora span:nth-child(3) { background: #1a8cff; width: 22vw; height: 22vw; top: 42vh; left: 38vw; opacity: 0.18; }
.grid-bg {
  z-index: 0;
  background-image:
    linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
  background-size: 84px 84px;
  mask-image: radial-gradient(circle at 70% 0%, #000 10%, transparent 68%);
  opacity: 0.4;
}
#login, #app { position: relative; z-index: 1; }

.login { min-height: 100vh; display: grid; place-items: center; padding: 28px 20px; }
.login-card {
  width: min(460px, 100%);
  padding: 36px 32px 28px;
  border-radius: 32px;
  background:
    linear-gradient(180deg, rgba(22, 34, 56, 0.72), rgba(8, 12, 22, 0.88));
  border: 1px solid var(--line-strong);
  box-shadow: 0 30px 90px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.06);
  backdrop-filter: blur(18px);
}
.login-card img {
  width: 92px;
  height: 92px;
  border-radius: 50%;
  margin-bottom: 18px;
  box-shadow: 0 0 0 8px rgba(73, 200, 255, 0.1), 0 18px 40px rgba(0, 0, 0, 0.35);
}
.login-card h1 {
  font-weight: 620;
  letter-spacing: -0.04em;
  margin: 0 0 8px;
  font-size: clamp(2.4rem, 6vw, 3.2rem);
  line-height: 0.95;
}
.eyebrow {
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--blue);
  font-size: 0.74rem;
  font-weight: 650;
  margin: 0 0 8px;
}

  function renderSection(id, content, phoneLink) {
    switch (id) {
      case "about":
        return renderAbout(content);
      case "services":
        return renderServices(content);
      case "zones":
        return renderZones(content);
      case "steps":
        return renderSteps(content);
      case "gallery":
        return renderGallery(content);
      case "quote":
        return renderQuote(content);
      case "testimonials":
        return renderTestimonials(content);
      case "hours":
        return renderHours(content);
      case "faq":
        return renderFaq(content);
      case "booking":
        return renderBooking(content, phoneLink);
      default:
        return "";
    }
  }
  function head(kicker, title, text = "") {
    return `<div class="section-head reveal">
    <p class="kicker">${esc(kicker)}</p>
    <h2>${esc(title)}</h2>
    ${text ? `<p>${esc(text)}</p>` : ""}
  </div>`;
  }
  function renderAbout(content) {
    return `<section class="section" id="atelier">
    <div class="container about-grid">
      <div>
        ${head(content.about.kicker, content.about.title, content.about.text)}
      </div>
      <div class="points">
        ${content.about.points.map(
      (point, index) => `<article class="reveal" style="--d:${index * 70}ms">
            <span>0${index + 1}</span>
            <h3>${esc(point.title)}</h3>
            <p>${rich(point.text)}</p>
          </article>`
    ).join("")}
      </div>
    </div>
  </section>`;
  }
  function renderServices(content) {
    const categories = [...new Set(content.services.map((item) => item.category).filter(Boolean))];
    return `<section class="section" id="soins">
    <div class="container">
      ${head(content.servicesIntro.kicker, content.servicesIntro.title, content.servicesIntro.text)}
      ${categories.length > 1 ? `<div class="filters" role="tablist">${["Tout", ...categories].map(
      (category, index) => `<button type="button" class="chip${index === 0 ? " on" : ""}" data-filter="${index === 0 ? "all" : esc(category)}">${esc(category)}</button>`
    ).join("")}</div>` : ""}
      <div class="service-grid">
        ${content.services.map((service, index) => serviceCard(service, index)).join("")}
      </div>
    </div>
  </section>`;
  }
  function serviceCard(service, index) {
    const off = service.availability !== "disponible";
    return `<article class="service reveal${service.featured ? " featured" : ""}${off ? " off" : ""}" data-category="${esc(service.category)}" style="--d:${index % 3 * 80}ms">
    <div class="service-top">
      <span class="cat">${esc(service.category)}</span>
      <span class="pill ${off ? "bad" : "ok"}">${off ? "Indisponible" : "Disponible"}</span>
    </div>
    ${service.featured ? `<span class="signature">Signature</span>` : ""}
    <h3>${esc(service.name)}</h3>
    <p>${rich(service.description)}</p>
    <div class="service-foot">
      <strong>${esc(service.price)}</strong>
      ${service.duration ? `<span>${esc(service.duration)}</span>` : ""}
    </div>
  </article>`;
  }
  function renderZones(content) {
    return `<section class="section" id="secteurs">
    <div class="container">
      ${head(content.zonesIntro.kicker, content.zonesIntro.title, content.zonesIntro.text)}
      <div class="zone-grid">
        ${content.zones.map((zone, index) => zoneCard(zone, index)).join("")}
      </div>
    </div>
  </section>`;
  }
  function zoneCard(zone, index) {
    const off = zone.availability !== "disponible";
    return `<article class="zone reveal${off ? " off" : ""}" style="--d:${index * 80}ms">
    <span class="zone-index">${String(index + 1).padStart(2, "0")}</span>
    <h3>${esc(zone.name)}</h3>
    ${zone.area ? `<p class="zone-area">${esc(zone.area)}</p>` : ""}
    <p>${rich(zone.description)}</p>
    <span class="pill ${off ? "bad" : "ok"}">${off ? "Secteur complet" : "On s'y d\xE9place"}</span>
  </article>`;
  }
  function renderSteps(content) {
    return `<section class="section" id="demarche">
    <div class="container">
      ${head(content.stepsIntro.kicker, content.stepsIntro.title, content.stepsIntro.text)}
      <div class="steps">
        ${content.steps.map(
      (step, index) => `<article class="step reveal" style="--d:${index * 80}ms">
            <span>${String(index + 1).padStart(2, "0")}</span>
            <h3>${esc(step.title)}</h3>
            <p>${rich(step.text)}</p>
          </article>`
    ).join("")}
      </div>
    </div>
  </section>`;
  }
  function renderGallery(content) {
    const items = content.gallery.filter((item) => item.visible);
    if (!items.length) return "";
    return `<section class="section" id="galerie">
    <div class="container">
      ${head(content.galleryIntro.kicker, content.galleryIntro.title, content.galleryIntro.text)}
      <div class="gallery">
        ${items.map((item, index) => galleryCard(item, index)).join("")}
      </div>
    </div>
  </section>`;
  }
  function galleryCard(item, index) {
    const photo = item.imageUrl ? `<img src="${esc(item.imageUrl)}" alt="${esc(item.title)}" />` : `<span class="motif motif-${esc(item.motif)}"></span>`;
    return `<article class="tile reveal" style="--d:${index % 3 * 70}ms">
    <div class="tile-visual">${photo}<span class="tile-index">${String(index + 1).padStart(2, "0")}</span></div>
    <div class="tile-copy">
      <h3>${esc(item.title)}</h3>
      ${item.caption ? `<p>${esc(item.caption)}</p>` : ""}
    </div>
  </article>`;
  }
  function renderQuote(content) {
    return `<section class="quote-band">
    <div class="container">
      <p class="quote-mark" aria-hidden="true">\u201C</p>
      <blockquote>${esc(content.quote.text)}</blockquote>
      <p class="quote-by">${esc(content.quote.by)}</p>
    </div>
  </section>`;
  }
  function renderTestimonials(content) {
    const items = content.testimonials.filter((item) => item.visible && item.text);
    if (!items.length) return "";
    return `<section class="section" id="avis">
    <div class="container">
      ${head(content.testimonialsIntro.kicker, content.testimonialsIntro.title, content.testimonialsIntro.text)}
      <div class="reviews">
        ${items.map((item, index) => reviewCard(item, index)).join("")}
      </div>
    </div>
  </section>`;
  }
  function reviewCard(item, index) {
    const stars = Math.max(1, Math.min(5, item.stars));
    return `<article class="review reveal" style="--d:${index * 70}ms">
    <p class="stars" aria-label="${stars} sur 5">${"\u2605".repeat(stars)}${"\u2606".repeat(5 - stars)}</p>
    <blockquote>${rich(item.text)}</blockquote>
    <p class="who"><strong>${esc(item.name)}</strong>${item.area ? `<span>${esc(item.area)}</span>` : ""}</p>
  </article>`;
  }
  function renderHours(content) {
    const today = todayName();
    return `<section class="section" id="horaires">
    <div class="container hours-layout">
      <div>${head(content.hoursIntro.kicker, content.hoursIntro.title, content.hoursIntro.note)}</div>
      <div class="hours">
        ${content.hours.map((hour) => {
      const current = hour.day.toLowerCase() === today;
      return `<div class="hour${hour.closed ? " closed" : ""}${current ? " today" : ""}">
              <span>${esc(hour.day)}${current ? `<em>Aujourd'hui</em>` : ""}</span>
              <strong>${esc(hour.closed ? "Ferm\xE9" : hour.hours)}</strong>
            </div>`;
    }).join("")}
      </div>
    </div>
  </section>`;
  }
  function renderFaq(content) {
    if (!content.faq.length) return "";
    return `<section class="section" id="questions">
    <div class="container faq-layout">
      <div>${head(content.faqIntro.kicker, content.faqIntro.title)}</div>
      <div class="faq">
        ${content.faq.map(
      (item) => `<article class="faq-item">
            <button type="button" aria-expanded="false">
              <span>${esc(item.question)}</span>
              <i aria-hidden="true"></i>
            </button>
            <div class="faq-a"><div><p>${rich(item.answer)}</p></div></div>
          </article>`
    ).join("")}
      </div>
    </div>
  </section>`;
  }
  function renderBooking(content, phoneLink) {
    const services = content.services.filter((item) => item.availability === "disponible");
    const zones = content.zones.filter((item) => item.availability === "disponible");
    const labels = content.booking.labels;
    const paused = !content.booking.enabled;
    return `<section class="section booking" id="reservation">
    <div class="container booking-grid">
      <div>
        ${head(content.booking.kicker, content.booking.title, content.booking.text)}
        <p class="status status-${content.status.state} status-inline"><i></i><span>${esc(STATUS_LABEL[content.status.state])}</span> ${esc(content.status.message)}</p>
        <div class="contact-row">
          ${phoneLink ? `<a class="btn btn-ghost" href="${esc(phoneLink)}">${esc(content.brand.phoneDisplay)}</a>` : ""}
        </div>
      </div>
      <div class="form-card">
        ${paused ? `<div class="pause">${rich(content.booking.pauseMessage)}</div>` : `<form id="booking-form">
            <div class="hp" aria-hidden="true"><label>Soci\xE9t\xE9<input name="company" tabindex="-1" autocomplete="off" /></label></div>
            <div class="form-grid">
              <label class="field">${esc(labels.name)}<input name="name" required maxlength="80" autocomplete="name" /></label>
              <label class="field">${esc(labels.phone)}<input name="phone" required maxlength="24" autocomplete="tel" inputmode="tel" /></label>
              <label class="field full">${esc(labels.email)}<input name="email" type="email" maxlength="120" autocomplete="email" /></label>
              <label class="field">${esc(labels.service)}
                <select name="service" required ${services.length ? "" : "disabled"}>
                  <option value="">${services.length ? "Choisir" : "Aucun soin disponible"}</option>
                  ${services.map((item) => `<option value="${esc(item.name)}">${esc(item.name)}</option>`).join("")}
                </select>
              </label>
              <label class="field">${esc(labels.zone)}
                <select name="zone" required ${zones.length ? "" : "disabled"}>
                  <option value="">${zones.length ? "Choisir" : "Aucun secteur disponible"}</option>
                  ${zones.map((item) => `<option value="${esc(item.name)}">${esc(item.name)}</option>`).join("")}
                </select>
              </label>
              <label class="field full">${esc(labels.date)}<input name="date" type="date" min="${todayInToronto()}" /></label>
              <label class="field full">${esc(labels.message)}<textarea name="message" rows="4" maxlength="1000" placeholder="V\xE9hicule, entr\xE9e, pr\xE9cisions..."></textarea></label>
            </div>
            <p class="form-error" hidden></p>
            <button class="btn btn-primary full-btn" type="submit" ${services.length && zones.length ? "" : "disabled"}>${esc(content.booking.submitLabel)}</button>
            <p class="disclaimer">${esc(content.booking.disclaimer)}</p>
          </form>
          <div id="booking-success" class="success" hidden>
            <span class="check" aria-hidden="true"></span>
            <h3>${esc(content.booking.successTitle)}</h3>
            <p>${esc(content.booking.successText)}</p>
            ${phoneLink ? `<a class="btn btn-ghost" href="${esc(phoneLink)}">Appeler ${esc(content.brand.phoneDisplay)}</a>` : ""}
          </div>`}
      </div>
    </div>
  </section>`;
  }

  <script type="text/plain" id="lc-admin-js">(() => {
	const TAB_GROUPS = [
		["Aujourd'hui", [["apercu", "Aperçu"], ["demandes", "Demandes"]]],

	const STATUSES = [
		["nouveau", "Nouveau"],
		["confirme", "Confirmé"],
		["fait", "Fait"],
		["annule", "Annulé"],
	];
	const MOTIFS = [
		["eau", "Eau"],
		["cuir", "Cuir"],
		["chrome", "Chrome"],
		["bac", "Bac"],
		["jantes", "Jantes"],
		["nuit", "Nuit"],
	];

	const DEFAULT_PASSWORD = "LaCoche5538";
	const state = {
		content: null,
		bookings: [],
		tab: "apercu",
		dirty: false,
		passwordChanged: true,
		mode: "server",
	};
	let memoryPassword = "";

	function storage() {
		try {
			const key = "lc_storage_probe";
			localStorage.setItem(key, "1");
			localStorage.removeItem(key);
			return localStorage;
		} catch {
			return null;
		}
	}

	function readStore(key) {
		const box = storage();
		if (!box) return null;
		try {
			const raw = box.getItem(key);
			return raw ? JSON.parse(raw) : null;
		} catch {
			return null;
		}
	}

	function writeStore(key, value) {
		const box = storage();
		if (!box) return false;
		box.setItem(key, JSON.stringify(value));
		return true;
	}

	function defaultContent() {
		const node = document.getElementById("lc-default");
		if (!node) return null;
		return JSON.parse(node.textContent);
	}

	function currentPassword() {
		return memoryPassword || readStore("lc_offline_password") || DEFAULT_PASSWORD;
	}

	function persistOffline() {
		const pack = { updatedAt: Date.now(), content: state.content };
		const savedContent = writeStore("lc_offline_pack", pack) && writeStore("lc_offline_content", state.content);
		writeStore("lc_offline_bookings", state.bookings);
		return savedContent;
	}

	const esc = (value) =>
		String(value ?? "").replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[char]);

	const uid = (prefix) => `${prefix}-${Math.random().toString(36).slice(2, 8)}`;

	const listOf = (name) => (name === "points" ? state.content.about.points : state.content[name]);

	const blank = {
		services: () => ({ id: uid("svc"), name: "Nouveau soin", category: "Extérieur", description: "Décrivez le soin.", price: "Dès 0 $", duration: "30 min", availability: "disponible", featured: false }),

		hours: () => ({ id: uid("hour"), day: "Jour", hours: "9 h – 17 h", closed: false }),
		steps: () => ({ id: uid("step"), title: "Nouvelle étape", text: "Décrivez l'étape." }),
		gallery: () => ({ id: uid("gal"), title: "Nouveau visuel", caption: "", imageUrl: "", motif: "eau", visible: true }),
		testimonials: () => ({ id: uid("avis"), name: "Client", area: "", text: "Le commentaire.", stars: 5, visible: true }),
		faq: () => ({ id: uid("faq"), question: "Nouvelle question", answer: "La réponse." }),

		points: () => ({ id: uid("pt"), title: "Nouveau point", text: "Le détail." }),
	};

	function toast(message) {
		const node = document.getElementById("toast");
		node.textContent = message;
		node.classList.add("show");
		clearTimeout(toast.timer);
		toast.timer = setTimeout(() => node.classList.remove("show"), 2600);
	}

	function updateSave() {
		const here = state.mode === "file";
		document.getElementById("save-label").textContent = state.dirty
			? here
				? "Pas sur l'autre appareil"
				: "Modifications non enregistrées"
			: here
				? "Enregistré ici"
				: "À jour";
		document.getElementById("save-btn").disabled = !state.dirty;
		document.getElementById("savebar").classList.toggle("dirty", state.dirty);
	}

	function showBanner() {
		const banner = document.getElementById("banner");
		if (state.mode === "file") {
			banner.hidden = false;
			banner.textContent = "Le téléphone et l'ordinateur ont chacun leur copie. Synchroniser crée le fichier à ouvrir sur l'autre appareil, à la place de l'ancien.";
			return;
		}
		if (state.passwordChanged) {
			banner.hidden = true;
			return;
		}
		banner.hidden = false;
		banner.textContent = "Le mot de passe initial est encore actif. Changez-le dans Compte avant de partager l'adresse de l'espace pro.";
	}

	function setPath(path, value) {
		const parts = path.split(".");
		let cursor = state.content;
		for (let i = 0; i < parts.length - 1; i += 1) cursor = cursor[parts[i]];
		cursor[parts[parts.length - 1]] = value;
		state.dirty = true;
		updateSave();
		schedulePublish();
	}

	function field(label, bind, value, type = "text") {
		return `<label class="f">${esc(label)}<input data-bind="${esc(bind)}" type="${esc(type)}" value="${esc(value)}" /></label>`;
	}
	function area(label, bind, value) {
		return `<label class="f">${esc(label)}<textarea data-bind="${esc(bind)}">${esc(value)}</textarea></label>`;
	}
	function check(label, bind, checked) {
		return `<label class="check"><input data-bind="${esc(bind)}" type="checkbox" ${checked ? "checked" : ""} /><span>${esc(label)}</span></label>`;
	}
	function options(selected, pairs) {
		return pairs.map(([value, label]) => `<option value="${esc(value)}"${value === selected ? " selected" : ""}>${esc(label)}</option>`).join("");
	}
	function avail(list, id, value) {
		return `<select class="avail avail-${esc(value)}" data-list="${esc(list)}" data-id="${esc(id)}" data-field="availability">${options(value, [["disponible", "Disponible"], ["indisponible", "Indisponible"]])}</select>`;

	function actions(list, id) {

      <button type="button" data-action="move" data-list="${esc(list)}" data-id="${esc(id)}" data-dir="-1" aria-label="Monter">↑</button>

      <button type="button" data-action="remove" data-list="${esc(list)}" data-id="${esc(id)}">Retirer</button>

	function addButton(list, label) {
		return `<button type="button" class="ghost" data-action="add" data-list="${esc(list)}">${esc(label)}</button>`;
	}
	function inputItem(list, id, fieldName, label, value, type = "text") {
		return `<label class="f">${esc(label)}<input data-list="${esc(list)}" data-id="${esc(id)}" data-field="${esc(fieldName)}" type="${esc(type)}" value="${esc(value)}" /></label>`;

			document.getElementById("view").innerHTML = `<section class="card"><h2>Affichage impossible</h2><p class="hint">Le contenu chargé est incomplet. Recharge la page sans enregistrer.</p></section>`;

	async function api(url, options = {}) {
		const response = await fetch(url, options);
		if (response.status === 401 && !url.endsWith("/login")) {
			showLogin();
			throw new Error("Session expirée.");
		}
		return response;
	}

	function showLogin() {
		document.getElementById("app").hidden = true;
		document.getElementById("login").hidden = false;
	}

	async function enter() {
		const [contentRes, bookingRes, sessionRes] = await Promise.all([
			fetch("/api/admin/content"),
			fetch("/api/admin/bookings"),
			fetch("/api/admin/session"),
		]);
		if (!contentRes.ok) {
			showLogin();
			return;
		}
		state.content = await contentRes.json();
		state.bookings = bookingRes.ok ? await bookingRes.json() : [];
		if (sessionRes.ok) state.passwordChanged = !!(await sessionRes.json()).passwordChanged;
		state.dirty = false;
		state.mode = "server";
		openApp();
	}

  <script>(() => {

		return new Intl.DateTimeFormat("en-CA", {
			timeZone: "America/Toronto",
			year: "numeric",
			month: "2-digit",
			day: "2-digit",
		}).format(new Date());
	}

	function storeLocalBooking(data) {
		if (typeof data.company === "string" && data.company.trim()) return "";
		const name = String(data.name || "").trim();
		const phone = String(data.phone || "").trim();
		const email = String(data.email || "").trim();
		const service = String(data.service || "").trim();
		const zone = String(data.zone || "").trim();
		const date = String(data.date || "").trim();
		const message = String(data.message || "").trim().slice(0, 1000);
		if (name.length < 2) return "Indiquez votre nom.";
		if (phone.replace(/\D/g, "").length < 7) return "Indiquez un téléphone valide.";
		if (email && (email.length > 120 || !email.includes("@"))) return "Courriel invalide.";
		if (!service) return "Choisissez un soin disponible.";
		if (!zone) return "Choisissez un secteur disponible.";
		if (date && !/^\d{4}-\d{2}-\d{2}$/.test(date)) return "Date invalide.";
		if (date && date < todayToronto()) return "Choisissez une date à venir.";
		let list = [];
		try {
			list = JSON.parse(localStorage.getItem("lc_offline_bookings") || "[]");
			if (!Array.isArray(list)) list = [];
		} catch {
			list = [];
		}
		list.unshift({
			id: Date.now(),
			name,
			phone,
			email,
			service,
			zone,
			preferred_date: date,
			message,
			status: "nouveau",
			created_at: new Date().toISOString(),
		});
		localStorage.setItem("lc_offline_bookings", JSON.stringify(list.slice(0, 200)));
		return "";
	}

		if (mountAbort) mountAbort.abort();

		const signal = abort.signal;
		const scope = root && root.querySelector ? root : document;
		const listen = (node, type, fn, options) => {
			if (!node) return;
			node.addEventListener(type, fn, options ? { ...options, signal } : { signal });
		};

		document.documentElement.dataset.motion = "1";
		const nav = scope.querySelector(".nav");
		const progress = scope.querySelector(".progress");
		const burger = scope.querySelector(".burger");
		const links = scope.querySelector(".nav-links");

		const onScroll = () => {
			if (nav) nav.classList.toggle("scrolled", window.scrollY > 8);
			if (progress) {
				const height = document.documentElement.scrollHeight - window.innerHeight;
				progress.style.transform = `scaleX(${height > 0 ? window.scrollY / height : 0})`;
			}
		};
		listen(document, "scroll", onScroll, { passive: true });
		onScroll();

		if (burger && links) {
			listen(burger, "click", () => {
				const open = links.classList.toggle("open");
				burger.setAttribute("aria-expanded", open ? "true" : "false");
			});
			listen(links, "click", (event) => {
				if (event.target.closest("a")) {
					links.classList.remove("open");
					burger.setAttribute("aria-expanded", "false");
				}
			});
			listen(document, "click", (event) => {
				if (!links.classList.contains("open")) return;
				if (event.target.closest(".nav")) return;
				links.classList.remove("open");
				burger.setAttribute("aria-expanded", "false");
			});
			listen(document, "keydown", (event) => {
				if (event.key !== "Escape" || !links.classList.contains("open")) return;
				links.classList.remove("open");
				burger.setAttribute("aria-expanded", "false");
			});
		}

		const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
		const reveals = scope.querySelectorAll(".reveal");
		if (reduce || !("IntersectionObserver" in window)) {
			reveals.forEach((el) => el.classList.add("in"));
		} else {
			const observer = new IntersectionObserver(
				(entries) => {
					entries.forEach((entry) => {
						if (!entry.isIntersecting) return;
						entry.target.classList.add("in");
						observer.unobserve(entry.target);
					});
				},
				{ threshold: 0.14, rootMargin: "0px 0px -8% 0px" },
			);
			signal.addEventListener("abort", () => observer.disconnect());
			reveals.forEach((el) => observer.observe(el));
		}

		scope.querySelectorAll(".filters").forEach((bar) => {
			listen(bar, "click", (event) => {
				const button = event.target.closest(".chip");
				if (!button) return;
				bar.querySelectorAll(".chip").forEach((chip) => chip.classList.remove("on"));
				button.classList.add("on");
				const filter = button.dataset.filter;
				scope.querySelectorAll(".service").forEach((card) => {
					card.hidden = filter !== "all" && card.dataset.category !== filter;
				});
			});
		});

		scope.querySelectorAll(".faq-item button").forEach((button) => {
			listen(button, "click", () => {
				const item = button.closest(".faq-item");
				const open = item.classList.toggle("open");
				button.setAttribute("aria-expanded", open ? "true" : "false");
			});
		});

		const form = scope.querySelector("#booking-form");
		if (!form) return;
		listen(form, "submit", async (event) => {
			event.preventDefault();
			const error = form.querySelector(".form-error");
			const button = form.querySelector("button[type=submit]");
			const success = scope.querySelector("#booking-success");
			if (error) error.hidden = true;
			if (button) button.disabled = true;
			const data = Object.fromEntries(new FormData(form).entries());
			const showError = (message) => {
				if (error) {
					error.textContent = message;
					error.hidden = false;
				}
				if (button) button.disabled = false;
			};
			const showSuccess = () => {
				form.hidden = true;
				if (success) success.hidden = false;
			};
			const local = location.protocol === "file:" || document.documentElement.dataset.studio === "1";
			if (local) {
				try {
					const problem = storeLocalBooking(data);
					if (problem) {
						showError(problem);
						return;
					}
					showSuccess();
				} catch {
					showError("La demande n'a pas pu être gardée dans ce navigateur.");
				}
				return;
			}
			try {
				const response = await fetch("/api/bookings", {
					method: "POST",
					headers: { "content-type": "application/json" },
					body: JSON.stringify(data),
				});
				const payload = await response.json().catch(() => ({}));
				if (!response.ok) throw new Error(payload.error || "Envoi impossible.");
				showSuccess();
			} catch (errorValue) {
				showError(errorValue.message || "Envoi impossible.");
			}
		});
	}

	globalThis.mountLaCocheSite = mountLaCocheSite;
	if (!document.getElementById("site-root")) mountLaCocheSite(document);

	if (!document.getElementById("site-root") && "BroadcastChannel" in window) {
		const channel = new BroadcastChannel("la-coche");
		channel.addEventListener("message", (event) => {
			if (event.data && event.data.type === "reload") location.reload();
		});
	}
})();
</script>
  <script>(() => {
	const root = document.getElementById("site-root");
	const layer = document.getElementById("admin-layer");
	const frame = document.getElementById("admin-frame");
	if (!root || !layer || !frame) return;

	document.documentElement.dataset.studio = "1";

	function asset(id) {
		const node = document.getElementById(id);
		return node ? node.textContent : "";
	}

	function readJson(id) {
		const raw = asset(id);
		if (!raw.trim()) return null;
		try {
			return JSON.parse(raw);
		} catch {
			return null;
		}
	}

	function storedPack() {
		try {
			const raw = localStorage.getItem("lc_offline_pack");
			if (raw) return JSON.parse(raw);
			const legacy = localStorage.getItem("lc_offline_content");
			if (legacy) return { updatedAt: 1, content: JSON.parse(legacy) };
		} catch {
			return null;
		}
		return null;
	}

	function activeContent() {
		const filePack = readJson("lc-state");
		const localPack = storedPack();
		const fileTime = filePack && filePack.updatedAt ? filePack.updatedAt : 0;
		const localTime = localPack && localPack.updatedAt ? localPack.updatedAt : 0;
		if (localPack && localPack.content && localTime >= fileTime) return localPack.content;
		if (filePack && filePack.content) return filePack.content;
		const embedded = asset("lc-default");
		return embedded ? JSON.parse(embedded) : null;
	}

	function paint() {
		const base = activeContent();
		if (!base || typeof globalThis.renderLaCoche !== "function") return;
		const content = typeof globalThis.normalizeLaCoche === "function" ? globalThis.normalizeLaCoche(base) : base;
		let html = globalThis.renderLaCoche(content);
		const logo = asset("lc-logo").trim();
		if (logo) {
			html = html.split('href="/logo.png"').join(`href="${logo}"`);
			html = html.split('src="/logo.png"').join(`src="${logo}"`);
			html = html.split("https://lacoche.local/logo.png").join(logo);
		}
		const doc = new DOMParser().parseFromString(html, "text/html");
		doc.querySelectorAll("script").forEach((node) => node.remove());
		const y = window.scrollY;
		root.replaceChildren(...doc.body.childNodes);
		if (doc.title) document.title = doc.title;
		if (typeof globalThis.mountLaCocheSite === "function") globalThis.mountLaCocheSite(root);
		window.scrollTo(0, y);
	}

	function jsonForFile(value) {
		return JSON.stringify(value).replace(/</g, "\\u003c").replace(/>/g, "\\u003e").replace(/&/g, "\\u0026");
	}

	function exportHtml() {
		const pack = storedPack();
		if (!pack || !pack.content) return;
		const htmlNode = document.documentElement.cloneNode(true);
		const site = htmlNode.querySelector("#site-root");
		if (site) site.replaceChildren();
		const frameCopy = htmlNode.querySelector("#admin-frame");
		if (frameCopy) {
			frameCopy.removeAttribute("srcdoc");
			frameCopy.removeAttribute("data-ready");
		}
		const layerCopy = htmlNode.querySelector("#admin-layer");
		if (layerCopy) layerCopy.setAttribute("hidden", "");
		htmlNode.querySelector("body")?.classList.remove("admin-open");
		let stateNode = htmlNode.querySelector("#lc-state");
		if (!stateNode) {
			stateNode = document.createElement("script");
			stateNode.id = "lc-state";
			stateNode.type = "application/json";
			htmlNode.querySelector("body")?.prepend(stateNode);
		}
		stateNode.textContent = jsonForFile({ updatedAt: pack.updatedAt || Date.now(), content: pack.content });
		const html = "<!DOCTYPE html>\n" + htmlNode.outerHTML;
		const blob = new Blob([html], { type: "text/html" });
		const link = document.createElement("a");
		link.href = URL.createObjectURL(blob);
		link.download = "la-coche.html";
		document.body.appendChild(link);
		link.click();
		link.remove();
		setTimeout(() => URL.revokeObjectURL(link.href), 2000);
	}

	function adminDocument() {
		const logo = asset("lc-logo").trim() || "/logo.png";
		const css = asset("lc-admin-css");
		const defaults = asset("lc-default");
		const renderJs = asset("lc-render").replace(/<\/script/gi, "<\\/script");
		const adminJs = asset("lc-admin-js").replace(/<\/script/gi, "<\\/script");
		return `<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Espace pro · La Coche</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet" />
  <style>${css}</style>
</head>
<body>
  <div class="aurora" aria-hidden="true"><span></span><span></span><span></span></div>
  <div class="grid-bg" aria-hidden="true"></div>
  <div id="login" class="login">
    <form id="login-form" class="login-card">
      <img src="${logo}" alt="" width="92" height="92" />
      <p class="eyebrow">Espace pro</p>
      <h1>La Coche</h1>
      <p class="muted">Le panneau qui pilote le site. Tout ce que les visiteurs voient se modifie ici.</p>
      <label>
        Mot de passe
        <input type="password" name="password" autocomplete="current-password" required />
      </label>
      <p class="form-error" id="login-error" hidden></p>
      <button type="submit">Entrer</button>
    </form>
  </div>
  <div id="app" hidden>
    <aside class="sidebar">
      <a class="side-brand" href="/" target="_blank" rel="noreferrer">
        <img src="${logo}" alt="" />
        <span>
          <strong>La Coche</strong>
          <em>Voir le site</em>
        </span>
      </a>
      <nav id="tabs"></nav>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <a class="view-site" id="view-site" href="/">Voir le site</a>
        <label class="mobile-pick">
          Section
          <select id="tab-select"></select>
        </label>
        <div class="savebar" id="savebar">
          <span id="save-label">À jour</span>
          <button type="button" class="ghost" id="sync-btn" hidden>Synchroniser</button>
          <button type="button" id="save-btn">Enregistrer</button>
        </div>
      </header>
      <div id="banner" class="banner" hidden></div>
      <main id="view"></main>
    </div>
  </div>
  <div id="toast" role="status"></div>
  <script type="application/json" id="lc-default">${defaults}<\/script>
  <script>${renderJs}<\/script>
  <script>${adminJs}<\/script>
</body>
</html>`;
	}

	function openAdmin() {
		if (!frame.dataset.ready) {
			frame.srcdoc = adminDocument();
			frame.dataset.ready = "1";
		}
		layer.hidden = false;
		document.body.classList.add("admin-open");
		if (location.hash !== "#admin") history.replaceState(null, "", "#admin");
	}

	function closeAdmin() {
		const wasOpen = !layer.hidden;
		layer.hidden = true;
		document.body.classList.remove("admin-open");
		if (location.hash === "#admin") history.replaceState(null, "", location.pathname + location.search);
		if (wasOpen) paint();
	}

	root.addEventListener("click", (event) => {
		const link = event.target.closest('a[href="/admin"], a[href="#admin"], a[href="la-coche-admin.html"]');
		if (!link) return;
		event.preventDefault();
		openAdmin();
	});

	window.addEventListener("message", (event) => {
		const data = event.data;
		if (!data || typeof data !== "object") return;
		if (data.type === "lc-refresh") paint();
		if (data.type === "lc-export") exportHtml();
		if (data.type === "lc-close") closeAdmin();
	});

	if ("BroadcastChannel" in window) {
		const channel = new BroadcastChannel("la-coche");
		channel.addEventListener("message", (event) => {
			if (event.data && event.data.type === "lc-refresh") paint();
		});
	}

	window.addEventListener("hashchange", () => {
		if (location.hash === "#admin") openAdmin();
		else closeAdmin();
	});

	paint();
	if (location.hash === "#admin") openAdmin();
})();
</script>
</body>
</html>
