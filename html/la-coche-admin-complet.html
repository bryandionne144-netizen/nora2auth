  <style>
:root {
  --ink: #070b12;
  --panel: #101826;
  --line: rgba(186, 220, 255, 0.14);
  --ice: #f3f7ff;
  --muted: #93a6bd;
  --blue: #49c8ff;
  --good: #3ee0a2;
  --bad: #ff8ea3;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(800px 400px at 100% -10%, rgba(28, 125, 255, 0.18), transparent 50%),
    var(--ink);
  color: var(--ice);
  font-family: "Instrument Sans", "Segoe UI", sans-serif;
  letter-spacing: -0.011em;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid #8ad8ff; outline-offset: 2px; }
#login[hidden], #app[hidden], .banner[hidden] { display: none !important; }

.login { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
.login-card {
  width: min(440px, 100%);
  padding: 32px 28px;
  border-radius: 28px;
  background: rgba(16, 24, 38, 0.88);
  border: 1px solid var(--line);
  box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35);
}
.login-card img { width: 92px; height: 92px; border-radius: 50%; margin-bottom: 8px; }
.login-card h1 { font-family: "Instrument Sans", sans-serif; font-weight: 620; letter-spacing: -0.03em; margin: 0 0 8px; font-size: 2.4rem; }
.eyebrow { letter-spacing: 0.16em; text-transform: uppercase; color: var(--blue); font-size: 0.75rem; margin-bottom: 6px; }
.muted, .hint { color: var(--muted); }
.login-card label, .f { display: grid; gap: 6px; margin: 16px 0; font-size: 0.86rem; color: var(--muted); }
input, select, textarea {
  width: 100%;
  background: #0b111b;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 12px 12px;
}
textarea { min-height: 90px; resize: vertical; }
.login-card button, .primary, #save-btn, .danger {
  border: 0;
  border-radius: 999px;
  padding: 12px 16px;
  background: linear-gradient(180deg, #8adfff, #1c7dff);
  color: #041018;
  font-weight: 650;
}
.form-error { color: var(--bad); }

#app { min-height: 100vh; display: grid; grid-template-columns: 250px 1fr; }
.sidebar {
  position: sticky;
  top: 0;
  height: 100vh;
  padding: 18px 12px;
  border-right: 1px solid var(--line);
  background: rgba(7, 11, 18, 0.9);
  overflow: auto;
}
.side-brand { display: flex; gap: 10px; align-items: center; color: inherit; text-decoration: none; padding: 6px 8px 16px; }
.side-brand img { width: 42px; height: 42px; border-radius: 50%; }
.side-brand strong, .side-brand em { display: block; }
.side-brand strong { font-family: "Instrument Sans", sans-serif; font-weight: 650; letter-spacing: -0.03em; }
.side-brand em { font-style: normal; color: var(--blue); font-size: 0.82rem; }
#tabs { display: grid; gap: 4px; }
#tabs button {
  text-align: left;
  background: transparent;
  border: 0;
  color: #d5e2f2;
  border-radius: 12px;
  padding: 10px 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
#tabs button.on, #tabs button:hover { background: rgba(73, 200, 255, 0.1); }
#badge-demandes {
  min-width: 20px;
  height: 20px;
  border-radius: 999px;
  background: #ff5d7a;
  color: white;
  font-size: 0.72rem;
  display: grid;
  place-items: center;
  padding: 0 6px;
  font-style: normal;
}
#badge-demandes:empty { display: none; }
.workspace { min-width: 0; }
.topbar {
  position: sticky;
  top: 0;
  z-index: 5;
  display: flex;
  justify-content: flex-end;
  gap: 12px;
  align-items: center;
  padding: 14px 18px;
  background: rgba(7, 11, 18, 0.86);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
}
.mobile-pick { display: none; margin-right: auto; font-size: 0.8rem; color: var(--muted); gap: 6px; }
.savebar { display: flex; align-items: center; gap: 12px; }
#save-label { color: var(--muted); font-size: 0.88rem; }
#save-btn:disabled { opacity: 0.45; cursor: default; }
.banner {
  margin: 16px 18px 0;
  padding: 12px 14px;
  border-radius: 14px;
  background: rgba(255, 193, 77, 0.1);
  border: 1px solid rgba(255, 193, 77, 0.35);
  color: #ffe1a8;
}
#view { padding: 18px; display: grid; gap: 14px; }
.card, .editor {
  background: rgba(16, 24, 38, 0.78);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 16px;
}
.card h2, .editor h3 { font-family: "Instrument Sans", sans-serif; font-weight: 620; letter-spacing: -0.03em; margin: 0 0 8px; }
.grid-2, .grid-3 { display: grid; gap: 12px; }
.grid-2 { grid-template-columns: 1fr 1fr; }
.grid-3 { grid-template-columns: 1fr 1fr 1fr; }
.span-2 { grid-column: 1 / -1; }
.states { display: flex; flex-wrap: wrap; gap: 8px; }
.states button, .ghost, .row-actions button {
  background: transparent;
  border: 1px solid var(--line);
  color: var(--ice);
  border-radius: 999px;
  padding: 8px 12px;
}
.states button.on { background: white; color: #071018; }
.quick { display: flex; justify-content: space-between; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.quick strong, .quick small { display: block; }
.quick small { color: var(--muted); }
.quick select { width: auto; min-width: 150px; }
.editor header { display: flex; justify-content: space-between; gap: 10px; align-items: center; margin-bottom: 8px; }
.row-actions { display: flex; gap: 6px; }
.check { display: flex; align-items: center; gap: 8px; color: var(--ice); }
.check input { width: auto; }
.stats-line { display: flex; gap: 10px; flex-wrap: wrap; }
.stat {
  padding: 12px 14px;
  border-radius: 16px;
  border: 1px solid var(--line);
  min-width: 120px;
}
.stat b { display: block; font-family: "Instrument Sans", sans-serif; font-weight: 650; letter-spacing: -0.03em; font-size: 1.6rem; }
.demand {
  display: grid;
  gap: 6px;
  padding: 14px 0;
  border-bottom: 1px solid var(--line);
}
.demand a { color: var(--blue); }
.demand .meta { color: var(--muted); font-size: 0.88rem; }
.inline { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.danger { background: transparent; color: var(--bad); border: 1px solid rgba(255, 142, 163, 0.4); }
#toast {
  position: fixed;
  bottom: 16px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: white;
  color: #071018;
  padding: 12px 16px;
  border-radius: 999px;
  opacity: 0;
  pointer-events: none;
  transition: 0.25s ease;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  border: 0;
}
.structure { display: grid; gap: 8px; }
.structure li {
  list-style: none;
  display: flex;
  justify-content: space-between;
  gap: 8px;
  align-items: center;
  padding: 8px 0;
  border-bottom: 1px solid var(--line);
}
.note { color: #c9d7e8; }

@media (max-width: 860px) {
  #app { grid-template-columns: 1fr; }
  .sidebar { display: none; }
  .mobile-pick { display: grid; }
  .grid-2, .grid-3 { grid-template-columns: 1fr; }
  .quick { align-items: stretch; flex-direction: column; }
  .quick select { width: 100%; }
  #save-label { display: none; }
}

</style>
</head>

		toast.timer = setTimeout(() => node.classList.remove("show"), 2600);
	}

	function updateSave() {
		document.getElementById("save-label").textContent = state.dirty ? "Modifications non enregistrées" : "À jour";
		document.getElementById("save-btn").disabled = !state.dirty;
	}

	function showBanner() {
		const banner = document.getElementById("banner");
		if (state.passwordChanged) {
			banner.hidden = true;
			return;
		}
		banner.hidden = false;
		banner.textContent = "Le mot de passe initial est encore actif. Changez-le dans Compte avant de partager l'adresse de l'espace pro.";
	}

	function setPath(path, value) {
		const parts = path.split(".");
		let cursor = state.content;
		for (let i = 0; i < parts.length - 1; i += 1) cursor = cursor[parts[i]];
		cursor[parts[parts.length - 1]] = value;
		state.dirty = true;
		updateSave();
	}

	function field(label, bind, value, type = "text") {
		return `<label class="f">${esc(label)}<input data-bind="${esc(bind)}" type="${esc(type)}" value="${esc(value)}" /></label>`;
	}
	function area(label, bind, value) {
		return `<label class="f">${esc(label)}<textarea data-bind="${esc(bind)}">${esc(value)}</textarea></label>`;
	}
	function check(label, bind, checked) {
		return `<label class="check"><input data-bind="${esc(bind)}" type="checkbox" ${checked ? "checked" : ""} /><span>${esc(label)}</span></label>`;
	}
	function options(selected, pairs) {
		return pairs.map(([value, label]) => `<option value="${esc(value)}"${value === selected ? " selected" : ""}>${esc(label)}</option>`).join("");
	}
	function avail(list, id, value) {
		return `<select data-list="${esc(list)}" data-id="${esc(id)}" data-field="availability">${options(value, [["disponible", "Disponible"], ["indisponible", "Indisponible"]])}</select>`;
	}
	function actions(list, id) {
		return `<div class="row-actions">
      <button type="button" data-action="move" data-list="${esc(list)}" data-id="${esc(id)}" data-dir="-1" aria-label="Monter">↑</button>
      <button type="button" data-action="move" data-list="${esc(list)}" data-id="${esc(id)}" data-dir="1" aria-label="Descendre">↓</button>
      <button type="button" data-action="remove" data-list="${esc(list)}" data-id="${esc(id)}">Retirer</button>
    </div>`;
	}
	function addButton(list, label) {
		return `<button type="button" class="ghost" data-action="add" data-list="${esc(list)}">${esc(label)}</button>`;
	}
	function inputItem(list, id, fieldName, label, value, type = "text") {
		return `<label class="f">${esc(label)}<input data-list="${esc(list)}" data-id="${esc(id)}" data-field="${esc(fieldName)}" type="${esc(type)}" value="${esc(value)}" /></label>`;
	}
	function areaItem(list, id, fieldName, label, value) {
		return `<label class="f">${esc(label)}<textarea data-list="${esc(list)}" data-id="${esc(id)}" data-field="${esc(fieldName)}">${esc(value)}</textarea></label>`;

		document.querySelectorAll("#tabs [data-tab]").forEach((button) => button.classList.toggle("on", button.dataset.tab === state.tab));
		document.getElementById("tab-select").value = state.tab;
		const badge = document.getElementById("badge-demandes");

	async function api(url, options = {}) {
		const response = await fetch(url, options);
		if (response.status === 401 && !url.endsWith("/login")) {
			showLogin();
			throw new Error("Session expirée.");
		}
		return response;
	}

	function showLogin() {
		document.getElementById("app").hidden = true;
		document.getElementById("login").hidden = false;
	}

	async function enter() {
		const [contentRes, bookingRes, sessionRes] = await Promise.all([
			fetch("/api/admin/content"),
			fetch("/api/admin/bookings"),
			fetch("/api/admin/session"),
		]);
		if (!contentRes.ok) {
			showLogin();
			return;
		}
		state.content = await contentRes.json();
		state.bookings = bookingRes.ok ? await bookingRes.json() : [];
		if (sessionRes.ok) state.passwordChanged = !!(await sessionRes.json()).passwordChanged;
		state.dirty = false;
		document.getElementById("login").hidden = true;
		document.getElementById("app").hidden = false;
		renderNav();
		render();
		updateSave();
		showBanner();
	}

	function flushMarquee() {
		const node = document.querySelector("[data-bind='marquee']");
		if (!node) return;
		state.content.marquee = node.value.split("\n").map((line) => line.trim()).filter(Boolean).slice(0, 24);
	}

	async function save() {
		if (!state.content) return;
		flushMarquee();
		const button = document.getElementById("save-btn");
		button.disabled = true;
		document.getElementById("save-label").textContent = "Enregistrement…";
		try {
			const response = await api("/api/admin/content", {
				method: "PUT",
				headers: { "content-type": "application/json" },
				body: JSON.stringify(state.content),
			});
			const data = await response.json().catch(() => ({}));
			if (!response.ok) throw new Error(data.error || "Enregistrement impossible.");
			state.content = data;
			state.dirty = false;
			toast("Enregistré. Le site est à jour.");
			render();
		} catch (error) {
			toast(error.message || "Enregistrement impossible.");
		}
		updateSave();
	}

	async function loadBookings() {
		const response = await api("/api/admin/bookings");
		if (response.ok) state.bookings = await response.json();
	}

	document.getElementById("login-form").addEventListener("submit", async (event) => {
		event.preventDefault();
		const error = document.getElementById("login-error");
		error.hidden = true;
		const password = new FormData(event.target).get("password");
		const response = await fetch("/api/admin/login", {
			method: "POST",
			headers: { "content-type": "application/json" },
			body: JSON.stringify({ password }),
		});
		const data = await response.json().catch(() => ({}));
		if (!response.ok) {
			error.hidden = false;
			error.textContent = data.error || "Connexion impossible.";
			return;
		}
		state.passwordChanged = !!data.passwordChanged;
		await enter();
	});

	document.getElementById("tabs").addEventListener("click", (event) => {
		const button = event.target.closest("[data-tab]");
		if (!button) return;
		state.tab = button.dataset.tab;
		render();
	});
	document.getElementById("tab-select").addEventListener("change", (event) => {
		state.tab = event.target.value;
		render();
	});
	document.getElementById("save-btn").addEventListener("click", () => save());

	document.getElementById("view").addEventListener("input", onEdit);
	document.getElementById("view").addEventListener("change", onEdit);
	document.getElementById("view").addEventListener("click", onClick);
	document.getElementById("view").addEventListener("submit", onSubmit);

	function onEdit(event) {
		const target = event.target;
		if (target.id === "import-file") return;
		if (target.dataset.booking) {
			if (event.type === "change") updateBooking(target.dataset.booking, target.value);
			return;
		}
		if (target.dataset.bind) {
			let value = target.type === "checkbox" ? target.checked : target.value;
			if (target.dataset.bind === "marquee") {
				value = String(target.value).split("\n").map((line) => line.trim()).filter(Boolean).slice(0, 24);
			}
			setPath(target.dataset.bind, value);
			return;
		}
		if (target.dataset.list && target.dataset.id && target.dataset.field) {
			const item = listOf(target.dataset.list).find((entry) => entry.id === target.dataset.id);
			if (!item) return;
			item[target.dataset.field] = target.dataset.kind === "int" ? Number(target.value) : target.type === "checkbox" ? target.checked : target.value;
			state.dirty = true;
			updateSave();
		}
	}

	function onClick(event) {
		const button = event.target.closest("[data-action]");
		if (!button) return;
		const action = button.dataset.action;
		if (action === "goto") {
			state.tab = button.dataset.tab;
			render();
			return;
		}
		if (action === "status") {
			state.content.status.state = button.dataset.value;
			state.dirty = true;
			updateSave();
			render();
			return;
		}
		if (action === "add" && blank[button.dataset.list]) {
			listOf(button.dataset.list).push(blank[button.dataset.list]());
			state.dirty = true;
			updateSave();
			render();
			return;
		}
		if (action === "remove") {
			const list = listOf(button.dataset.list);
			const index = list.findIndex((item) => item.id === button.dataset.id);
			if (index >= 0) list.splice(index, 1);
			state.dirty = true;
			updateSave();
			render();
			return;
		}
		if (action === "move") {
			const list = listOf(button.dataset.list);
			const index = list.findIndex((item) => item.id === button.dataset.id);
			const next = index + Number(button.dataset.dir);
			if (index < 0 || next < 0 || next >= list.length) return;
			const [item] = list.splice(index, 1);
			list.splice(next, 0, item);
			state.dirty = true;
			updateSave();
			render();
			return;
		}
		if (action === "section-move") {
			const order = state.content.sectionOrder;
			const index = order.indexOf(button.dataset.id);
			const next = index + Number(button.dataset.dir);
			if (index < 0 || next < 0 || next >= order.length) return;
			const [item] = order.splice(index, 1);
			order.splice(next, 0, item);
			state.dirty = true;
			updateSave();
			render();
			return;
		}
		if (action === "export") {
			const blob = new Blob([JSON.stringify(state.content, null, 2)], { type: "application/json" });
			const link = document.createElement("a");
			link.href = URL.createObjectURL(blob);
			link.download = "la-coche-contenu.json";
			link.click();
			URL.revokeObjectURL(link.href);
			return;
		}
		if (action === "booking-delete") {
			if (!confirm("Supprimer cette demande?")) return;
			removeBooking(button.dataset.id);
			return;
		}
		if (action === "reset") {
			if (!confirm("Revenir au contenu d'origine? Cette action remplace les textes du site.")) return;
			resetContent();
		}
	}

	async function onSubmit(event) {
		if (event.target.id !== "password-form") return;
		event.preventDefault();
		const data = Object.fromEntries(new FormData(event.target).entries());
		try {
			const response = await api("/api/admin/password", {
				method: "POST",
				headers: { "content-type": "application/json" },
				body: JSON.stringify(data),
			});
			const payload = await response.json().catch(() => ({}));
			if (!response.ok) throw new Error(payload.error || "Changement impossible.");
			state.passwordChanged = true;
			showBanner();
			event.target.reset();
			toast("Mot de passe mis à jour.");
		} catch (error) {
			toast(error.message || "Changement impossible.");
		}
	}

	document.getElementById("view").addEventListener("change", async (event) => {
		const input = event.target;
		if (input.id !== "import-file" || !input.files?.[0]) return;
		try {
			const text = await input.files[0].text();
			const data = JSON.parse(text);
			if (!data || typeof data !== "object" || Array.isArray(data)) throw new Error("Fichier invalide.");
			const response = await api("/api/admin/normalize", {
				method: "POST",
				headers: { "content-type": "application/json" },
				body: JSON.stringify(data),
			});
			const normalized = await response.json().catch(() => null);
			if (!response.ok || !normalized) throw new Error("Fichier invalide.");
			state.content = normalized;
			state.dirty = true;
			updateSave();
			render();
			toast("Fichier chargé. Enregistrez pour le publier.");
		} catch (error) {
			toast(error.message || "Fichier illisible.");
		}
		input.value = "";
	});

	async function updateBooking(id, status) {
		try {
			const response = await api(`/api/admin/bookings/${id}`, {
				method: "PATCH",
				headers: { "content-type": "application/json" },
				body: JSON.stringify({ status }),
			});
			if (!response.ok) throw new Error("Statut non mis à jour.");
			await loadBookings();
			render();
			toast("Demande mise à jour.");
		} catch (error) {
			toast(error.message || "Statut non mis à jour.");
		}
	}

	async function removeBooking(id) {
		try {
			const response = await api(`/api/admin/bookings/${id}`, { method: "DELETE" });
			if (!response.ok) throw new Error("Suppression impossible.");
			await loadBookings();
			render();
			toast("Demande supprimée.");
		} catch (error) {
			toast(error.message || "Suppression impossible.");
		}
	}

	async function resetContent() {
		try {
			const response = await api("/api/admin/reset", { method: "POST" });
			const data = await response.json().catch(() => null);
			if (!response.ok || !data) throw new Error("Réinitialisation impossible.");
			state.content = data;
			state.dirty = false;
			updateSave();
			render();
			toast("Contenu d'origine rétabli.");
		} catch (error) {
			toast(error.message || "Réinitialisation impossible.");
		}
	}

	document.addEventListener("keydown", (event) => {
		if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "s") {
			event.preventDefault();
			if (state.content) save();
		}
	});
	window.addEventListener("beforeunload", (event) => {
		if (!state.dirty) return;
		event.preventDefault();
		event.returnValue = "";
	});

	fetch("/api/admin/session").then((response) => {
		if (response.ok) enter();
	});
})();

</script>
</body>
</html>
